name: Data-layer conformance
on:
  pull_request:
    paths:
      - 'conformance/**'
      - 'lib/**'
      - 'test/ash/data_layer/dispatch_contract_test.exs'
      - '.github/workflows/conformance.yml'
      - 'mix.exs'
      - 'mix.lock'
  workflow_dispatch:
    inputs:
      benchmark:
        description: Run informational benchmark smoke profiles
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      CONFORMANCE_ADAPTERS: ${{ matrix.adapter }}
      CONFORMANCE_PG_DATABASE: ash_conformance_ci_${{ github.run_id }}_${{ github.run_attempt }}
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.0.1'
          elixir-version: '1.20.0'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            conformance/deps
            conformance/_build
          key: conformance-${{ runner.os }}-29.0.1-1.20.0-${{ matrix.adapter }}-${{ hashFiles('conformance/mix.lock', 'mix.exs') }}
      - run: mix deps.get --check-locked
      - run: mix check
      - run: mix conformance.inventory
      - name: Verify generated documentation
        run: |
          mix conformance.matrix
          mix conformance.features
          git diff --exit-code -- MATRIX.md COVERAGE.md CAPABILITIES.md FEATURES.md
      - name: Informational benchmark smoke
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark
        run: mix conformance.bench
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.adapter }}
          path: conformance/results/
          if-no-files-found: error
  core-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.0.1'
          elixir-version: '1.20.0'
      - run: mix deps.get --check-locked
      - run: mix test test/ash/data_layer/dispatch_contract_test.exs
